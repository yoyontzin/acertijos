<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Claves de los acertijos</title>
<style>
:root {
  --fondo: #fffaf4; --tinta: #2b2118; --suave: #6f5d4c;
  --caja: #fdf0e1; --borde: #d9822b; --acento: #b5651d;
  --bien: #2f6b3a; --mal: #9b2c2c; --campo: #ffffff;
}
@media (prefers-color-scheme: dark) {
  :root {
    --fondo: #1d1813; --tinta: #f1e7dc; --suave: #bba895;
    --caja: #2a2119; --borde: #d9822b; --acento: #e6a35c;
    --bien: #8fd19e; --mal: #f0a3a3; --campo: #15110d;
  }
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--fondo); color: var(--tinta);
  font: 17px/1.55 Georgia, "Times New Roman", serif;
}
main { max-width: 44rem; margin: 0 auto; padding: 1.5rem 1rem 4rem; }
h1 { font-size: 1.7rem; margin: .4rem 0 .3rem; color: var(--acento); }
p.intro { color: var(--suave); margin: 0 0 1.5rem; }
section {
  background: var(--caja); border: 1px solid var(--borde); border-radius: 6px;
  padding: .9rem 1rem 1rem; margin: 0 0 1rem; scroll-margin-top: 1rem;
}
section:target { box-shadow: 0 0 0 3px var(--borde); }
h2 { font-size: 1.1rem; margin: 0 0 .35rem; }
h2 span { color: var(--acento); margin-right: .35rem; }
.pista { margin: 0 0 .6rem; color: var(--suave); font-size: .95rem; }
form { display: flex; gap: .5rem; flex-wrap: wrap; }
input {
  flex: 1 1 10rem; min-width: 0; font: inherit; padding: .45rem .6rem;
  border: 1px solid var(--borde); border-radius: 4px;
  background: var(--campo); color: var(--tinta);
}
button {
  font: inherit; padding: .45rem .9rem; border: 0; border-radius: 4px;
  background: var(--borde); color: #fff; cursor: pointer;
}
button:disabled { opacity: .6; cursor: wait; }
.res { margin-top: .7rem; }
.res.bien { color: var(--tinta); border-left: 3px solid var(--bien); padding-left: .7rem; }
.res.mal { color: var(--mal); }
</style>
</head>
<body>
<main>
<h1>Claves de los acertijos</h1>
<p class="intro">Cada acertijo de los libros de la familia tiene aquí su solución, guardada bajo llave. La llave nunca es la respuesta del mismo acertijo. A veces es un dato que hay que buscar en el libro y a veces es la respuesta de otro acertijo. Si la escribes bien, la solución se abre.</p>

const ITERACIONES = 100000;
const SAL = "familiaPB-acertijo-";
function normalizar(s) {
  const vacias = new Set(['y', 'e', 'o', 'a', 'al', 'el', 'la', 'los', 'las', 'lo',
    'de', 'del', 'en', 'por', 'es', 'son', 'era', 'fue', 'un', 'una',
    'anos', 'ano', 'pesos', 'peso', 'reales', 'real', 'varas', 'vara',
    'huevos', 'cirios', 'dias', 'dia', 'marcos', 'marco', 'galerias',
    'cuadras', 'movimientos', 'maneras', 'rutas', 'invitados', 'colores',
    'hijos', 'kilos', 'kilo', 'almudes', 'veces', 'cantaros', 'cantaro',
    'llenos', 'lleno', 'cruces', 'parejas', 'abuelos', 'solo', 'sola',
    'calle', 'numero', 'hacienda', 'rancho', 'mineral', 'panteon', 'pueblo']);
  let t = String(s).toLowerCase().trim().replace(/½/g, '.5');
  t = t.normalize('NFD').replace(/[̀-ͯ]/g, '');
  t = t.replace(/(\d),(\d)/g, '$1.$2');
  t = t.replace(/(\d)\s*y\s*medio/g, '$1.5');
  const tokens = t.match(/\d+(?:\.\d+)?(?:\/\d+)?|[a-zñ]+/g) || [];
  return tokens.filter((x) => !vacias.has(x)).join('-');
}
const enc = new TextEncoder(), dec = new TextDecoder();
const desdeB64 = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
async function llave(clave, n) {
  const base = await crypto.subtle.importKey('raw', enc.encode(clave), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey(
    { name: 'PBKDF2', salt: enc.encode(SAL + n), iterations: ITERACIONES, hash: 'SHA-256' },
    base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
}
async function abrir(a, texto) {
  const k = await llave(normalizar(texto), a.n);
  for (const c of a.cajas) {
    try {
      const claro = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: desdeB64(c.iv) }, k, desdeB64(c.ct));
      return dec.decode(claro);
    } catch (e) { /* esta caja no abre con esa llave */ }
  }
  return null;
}

  s.querySelector('h2').append(a.titulo);
  s.querySelector('.pista').textContent = 'Para abrir la solución, escribe ' + a.llave + (a.formato ? ' ' + a.formato : '');
  const form = s.querySelector('form'), inp = s.querySelector('input'),
        btn = s.querySelector('button'), res = s.querySelector('.res');
  form.addEventListener('submit', async (ev) => {
    ev.preventDefault();
    if (!inp.value.trim()) return;
    btn.disabled = true; res.className = 'res'; res.textContent = 'Probando la llave…';
    const sol = await abrir(a, inp.value);

    if (sol) { res.className = 'res bien'; res.textContent = sol; }

  });

}
function irAlAcertijo() {
  const destino = location.hash && document.getElementById(location.hash.slice(1));
  if (destino) { destino.scrollIntoView(); const i = destino.querySelector('input'); if (i) i.focus({ preventScroll: true }); }
}
irAlAcertijo();
window.addEventListener('hashchange', irAlAcertijo);
</script>
